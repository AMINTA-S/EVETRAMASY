<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Forgot Password — EVETRAMASY</title>
<link rel="stylesheet" href="css/main.css"/>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="brand-name">EVETRAMASY</div>
    </div>

    <!-- Step 1: Enter username -->
    <div id="step-1">
      <h2 class="auth-title">Forgot Password 🔑</h2>
      <p class="auth-subtitle">Enter your username and we'll give you a hint.</p>

      <div id="fp-error"   class="alert alert-error"   style="display:none;margin-bottom:16px"></div>
      <div id="fp-hint"    class="alert alert-info"    style="display:none;margin-bottom:16px"></div>

      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="form-group">
          <label class="form-label">Username</label>
          <div class="input-group">
            <i data-lucide="user" class="input-icon"></i>
            <input type="text" id="fp-username" class="form-control" placeholder="Your username"/>
          </div>
        </div>
        <button class="btn btn-primary btn-full" onclick="getHint()">
          <i data-lucide="search"></i> Find My Account
        </button>
      </div>
    </div>

    <!-- Step 2: Reset password -->
    <div id="step-2" style="display:none">
      <h2 class="auth-title">Reset Password 🔒</h2>
      <p class="auth-subtitle">Enter your new password below.</p>

      <div id="reset-error"   class="alert alert-error"   style="display:none;margin-bottom:16px"></div>
      <div id="reset-success" class="alert alert-success" style="display:none;margin-bottom:16px"></div>

      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="form-group">
          <label class="form-label">New Password</label>
          <div class="input-group">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="new-password" class="form-control" placeholder="Min 6 characters"/>
            <span class="input-suffix" onclick="togglePwd('new-password',this)"><i data-lucide="eye"></i></span>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <div class="input-group">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="confirm-password" class="form-control" placeholder="Repeat password"/>
            <span class="input-suffix" onclick="togglePwd('confirm-password',this)"><i data-lucide="eye"></i></span>
          </div>
        </div>
        <button class="btn btn-primary btn-full" onclick="doReset()">
          <i data-lucide="check-circle"></i> Reset Password
        </button>
      </div>
    </div>

    <div style="text-align:center;margin-top:20px;font-size:13px;color:var(--text-muted)">
      Remember it? <a href="index.html">Sign in</a>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script>
  lucide.createIcons();
  let _foundUsername = '';

  function togglePwd(id, el) {
    const inp = document.getElementById(id);
    inp.type = inp.type === 'password' ? 'text' : 'password';
    el.innerHTML = inp.type === 'text' ? '<i data-lucide="eye-off"></i>' : '<i data-lucide="eye"></i>';
    lucide.createIcons();
  }

  function getHint() {
    const username = document.getElementById('fp-username').value.trim();
    const errEl  = document.getElementById('fp-error');
    const hintEl = document.getElementById('fp-hint');
    errEl.style.display = hintEl.style.display = 'none';

    if (!username) { errEl.textContent = 'Please enter your username.'; errEl.style.display = 'flex'; return; }

    const result = Auth.forgotPassword(username);
    if (result.error) { errEl.textContent = result.error; errEl.style.display = 'flex'; return; }

    _foundUsername = username;
    hintEl.textContent = `Account found! ${result.hint}`;
    hintEl.style.display = 'flex';

    setTimeout(() => {
      document.getElementById('step-1').style.display = 'none';
      document.getElementById('step-2').style.display = 'block';
    }, 1500);
  }

  function doReset() {
    const np = document.getElementById('new-password').value;
    const cp = document.getElementById('confirm-password').value;
    const errEl  = document.getElementById('reset-error');
    const succEl = document.getElementById('reset-success');
    errEl.style.display = succEl.style.display = 'none';

    if (np !== cp) { errEl.textContent = 'Passwords do not match.'; errEl.style.display = 'flex'; return; }
    const result = Auth.resetPassword(_foundUsername, np);
    if (result.error) { errEl.textContent = result.error; errEl.style.display = 'flex'; return; }

    succEl.textContent = 'Password reset successfully! Redirecting to login…';
    succEl.style.display = 'flex';
    setTimeout(() => window.location.href = 'index.html', 1500);
  }
</script>
</body>
</html>
