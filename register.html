<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Register — EVETRAMASY</title>
<link rel="stylesheet" href="css/main.css"/>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
<div class="auth-page">
  <div class="auth-card" style="max-width:520px">
    <div class="auth-logo">
      <div class="brand-name">EVETRAMASY</div>
      <div class="brand-tagline">Create your free account</div>
    </div>

    <!-- Role selector -->
    <div class="form-group" style="margin-bottom:20px">
      <label class="form-label">I am a…</label>
      <div class="role-selector">
        <button class="role-btn" data-role="customer" onclick="selectRole('customer',this)">
          <span class="role-icon">🧑</span> Customer
        </button>
        <button class="role-btn" data-role="organiser" onclick="selectRole('organiser',this)">
          <span class="role-icon">🎭</span> Organiser
        </button>
        <button class="role-btn" data-role="parking_owner" onclick="selectRole('parking_owner',this)">
          <span class="role-icon">🅿️</span> Lot Owner
        </button>
      </div>
    </div>

    <div id="reg-error" class="alert alert-error" style="display:none;margin-bottom:16px"></div>
    <div id="reg-success" class="alert alert-success" style="display:none;margin-bottom:16px"></div>

    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <div class="input-group">
            <i data-lucide="user" class="input-icon"></i>
            <input type="text" id="reg-name" class="form-control" placeholder="Your full name"/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Username *</label>
          <div class="input-group">
            <i data-lucide="at-sign" class="input-icon"></i>
            <input type="text" id="reg-username" class="form-control" placeholder="Choose username"/>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address *</label>
        <div class="input-group">
          <i data-lucide="mail" class="input-icon"></i>
          <input type="email" id="reg-email" class="form-control" placeholder="you@example.com"/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <div class="input-group">
          <i data-lucide="phone" class="input-icon"></i>
          <input type="tel" id="reg-phone" class="form-control" placeholder="+91 9876543210"/>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Password *</label>
          <div class="input-group">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="reg-password" class="form-control" placeholder="Min 6 chars"/>
            <span class="input-suffix" onclick="togglePwd('reg-password',this)"><i data-lucide="eye"></i></span>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password *</label>
          <div class="input-group">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="reg-confirm" class="form-control" placeholder="Repeat password"/>
            <span class="input-suffix" onclick="togglePwd('reg-confirm',this)"><i data-lucide="eye"></i></span>
          </div>
        </div>
      </div>

      <input type="hidden" id="reg-role" value=""/>

      <button class="btn btn-primary btn-full btn-lg" onclick="doRegister()">
        <i data-lucide="user-plus"></i> Create Account
      </button>

      <p style="text-align:center;font-size:13px;color:var(--text-muted)">
        Already have an account? <a href="index.html">Sign in</a>
      </p>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script>
  lucide.createIcons();

  // Pre-select role from URL param
  const urlRole = new URLSearchParams(location.search).get('role');
  if (urlRole) selectRole(urlRole, document.querySelector(`[data-role="${urlRole}"]`));

  function selectRole(role, btn) {
    document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('selected'));
    if (btn) btn.classList.add('selected');
    document.getElementById('reg-role').value = role;
  }

  function togglePwd(id, el) {
    const inp = document.getElementById(id);
    inp.type = inp.type === 'password' ? 'text' : 'password';
    el.innerHTML = inp.type === 'text' ? '<i data-lucide="eye-off"></i>' : '<i data-lucide="eye"></i>';
    lucide.createIcons();
  }

  function doRegister() {
    const errEl  = document.getElementById('reg-error');
    const succEl = document.getElementById('reg-success');
    errEl.style.display  = 'none';
    succEl.style.display = 'none';

    const data = {
      name:            document.getElementById('reg-name').value.trim(),
      username:        document.getElementById('reg-username').value.trim(),
      email:           document.getElementById('reg-email').value.trim(),
      phone:           document.getElementById('reg-phone').value.trim(),
      password:        document.getElementById('reg-password').value,
      confirmPassword: document.getElementById('reg-confirm').value,
      role:            document.getElementById('reg-role').value,
    };

    if (!data.role) {
      errEl.textContent = 'Please select your role (Customer / Organiser / Lot Owner).';
      errEl.style.display = 'flex'; return;
    }

    const result = Auth.register(data);
    if (result.error) {
      errEl.textContent = result.error;
      errEl.style.display = 'flex'; return;
    }

    succEl.textContent = `Account created! Redirecting to your dashboard…`;
    succEl.style.display = 'flex';
    setTimeout(() => Auth.redirectByRole(result.user.role), 1200);
  }
</script>
</body>
</html>
